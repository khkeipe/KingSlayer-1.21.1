# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Environment Properties

# The Minecraft version must agree with the NeoForge version to get a valid artifact
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)

# The NeoForge version for Minecraft 1.21.1 (see https://projects.neoforged.net/neoforged/neoforge)
neo_version=21.1.93
neo_version_range=[21.1.0,)
# The loader (FML) version range — NeoForge 1.21.x uses FML 4.x
loader_version_range=[4,)

# Parchment mappings (parameter names + javadocs layered over official Mojang mappings)
parchment_minecraft=1.21.1
parchment_mappings=2024.11.17

## Mod Properties

mod_id=kcs_kingslayer
